<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a95ff"/>
      <stop offset="55%" stop-color="#3a6bf5"/>
      <stop offset="100%" stop-color="#2440d8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f5ff"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0b1a52" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 日历卡片 -->
  <g filter="url(#shadow)">
    <rect x="222" y="248" width="580" height="536" rx="76" fill="url(#card)"/>
  </g>

  <!-- 卡片顶部条 -->
  <path d="M222 324 a76 76 0 0 1 76 -76 h428 a76 76 0 0 1 76 76 v54 h-580 z" fill="#e9eefe"/>

  <!-- 三个小点 -->
  <circle cx="300" cy="315" r="14" fill="#3a6bf5"/>
  <circle cx="348" cy="315" r="14" fill="#3a6bf5" opacity="0.55"/>
  <circle cx="396" cy="315" r="14" fill="#3a6bf5" opacity="0.28"/>

  <!-- 日期数字 -->
  <text x="286" y="530" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial"
        font-size="176" font-weight="700" fill="#2440d8" letter-spacing="-6">23</text>

  <!-- 日程条 -->
  <rect x="286" y="596" width="330" height="34" rx="17" fill="#c9d8ff"/>
  <rect x="636" y="596" width="90" height="34" rx="17" fill="#e3eaff"/>

  <rect x="286" y="660" width="220" height="34" rx="17" fill="#c9d8ff"/>
  <rect x="526" y="660" width="200" height="34" rx="17" fill="#e3eaff"/>

  <rect x="286" y="724" width="280" height="34" rx="17" fill="#dbe4ff"/>
</svg>
</body>
</html>
